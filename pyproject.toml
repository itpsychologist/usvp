[project]
name = "usvp"
version = "0.1.0"
description = "Вебсайт Управління соціальної та ветеранської політики Лубенської міської ради"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "wagtail>=7.4,<7.5",
    "django-environ>=0.12",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.9",
    "gunicorn>=23",
    "django-tailwind-cli>=4",
    "wagtail-2fa>=1.8",
    "django-axes[ipware]>=8.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.10",
    "wagtail-factories>=4.3",
    "factory-boy>=3.3",
    "ruff>=0.12",
    "djlint>=1.36",
    "pre-commit>=4",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM", "C4"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.djlint]
profile = "django"
indent = 2
max_line_length = 120
ignore = "H006,H030,H031"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests", "apps"]
addopts = "-ra --strict-markers"
