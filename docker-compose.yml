# Локальне середовище розробки: лише PostgreSQL.
# Продакшн-конфігурація (web, nginx) — Фаза 8.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-usvp}
      POSTGRES_USER: ${POSTGRES_USER:-usvp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-usvp}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-usvp}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
